name: Publish PR Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node.js with GitHub Registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@amandk5'

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Generate unique PR snapshot version
        id: version
        run: |
          VERSION="0.0.0-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}"
          npm version $VERSION --no-git-tag-version
          echo "pkg_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish snapshot to GitHub Packages
        run: npm publish --tag pr-${{ github.event.pull_request.number }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment install command on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `📦 **Unapproved PR Snapshot Published!**\n\nTest this build in your app immediately:\n\`\`\`bash\nnpm install @amandk5/service1@${{ steps.version.outputs.pkg_version }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
